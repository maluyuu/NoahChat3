id: example
token_env: DISCORD_TOKEN_EXAMPLE   # 環境変数名（値ではない）
display_name: "Example Bot"

llm:
  system_prompt: |
    あなたはフレンドリーなアシスタントです。
  gemini:
    model: gemini-2.5-flash
  ollama:
    model: qwen2.5:7b
    base_url: ~   # null = 環境変数 OLLAMA_BASE_URL を使用

rag:
  index_path: data/faiss_indices/example.index
  top_k: 5
  enabled: true

mcp:
  auto_approve: []
  require_confirm: []
