services:
  rag:
    build: ./services/rag
    ports:
      - "8002:8002"
    environment:
      DISCORD_MESSAGE_DB: /app/history/discord_messages.db
      DISCORD_RAG_TIMEZONE: Asia/Tokyo
      RAG_DEVICE: ${RAG_DEVICE:-auto}
      RAG_TORCH_NUM_THREADS: ${RAG_TORCH_NUM_THREADS:-auto}
      RAG_ENCODE_BATCH_SIZE: ${RAG_ENCODE_BATCH_SIZE:-auto}
      RAG_MAX_EMBED_TEXT_CHARS: ${RAG_MAX_EMBED_TEXT_CHARS:-12000}
      PYTORCH_ENABLE_MPS_FALLBACK: "1"
      TOKENIZERS_PARALLELISM: "false"
    restart: unless-stopped
    volumes:
      - ./data/faiss_indices:/app/indices
      - ./data/history:/app/history
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8002/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  bot_core:
    build: ./bot_core
    env_file: .env
    environment:
      TZ: Asia/Tokyo
      DISCORD_MESSAGE_DB: /app/data/history/discord_messages.db
      DISCORD_RAG_UPDATE_HOUR: "3"
    restart: unless-stopped
    depends_on:
      rag:
        condition: service_healthy
    volumes:
      - ./bot_core/personas:/app/personas
      - ./data:/app/data
